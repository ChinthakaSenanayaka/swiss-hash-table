services:
  build-intel:
    # use below commented line if you built the base Intel image on your local. Building this image takes 10 minutes.
    # image: build-intel-image:latest
    image: wchinthakaps/build-intel-image:2.0.0
    container_name: build-intel
    volumes:
      - ../../:/project
    entrypoint: /project/platforms/intel/entrypoint.sh